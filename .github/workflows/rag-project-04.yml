name: Project 04 — RAG PDF checks

on:
  pull_request:
    paths:
      - "projects/04-rag-knowledge-assistant/**"
      - ".github/workflows/rag-project-04.yml"
  push:
    branches: [main]
    paths:
      - "projects/04-rag-knowledge-assistant/**"
      - ".github/workflows/rag-project-04.yml"

jobs:
  test-and-build:
    name: Unit tests and Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/04-rag-knowledge-assistant
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
